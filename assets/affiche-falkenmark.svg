    <symbol id="fir" viewBox="0 0 12 22"><path d="M6 0 0 9h3l-3 6h4l-3 6h10l-3-6h4l-3-6h3z"/></symbol>
  </defs>
  <rect width="400" height="520" fill="url(#sky)"/>
