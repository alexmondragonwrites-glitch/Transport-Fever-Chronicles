<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice">
  <!-- Zierbild der Erlenmark: Wiesenland mit Fluss und See, Erlen am Ufer, ein Dorf, ein Graureiher, ein Erlenzweig mit Zapfen und Kätzchen. Keine Karte: Lage und Richtung von Orten, Seen und Flüssen sind frei gezeichnet. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bccad0"/>
      <stop offset=".62" stop-color="#e1e2d7"/>
      <stop offset="1" stop-color="#f1e5ca"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="324" x2="0" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a7c3c8"/>
      <stop offset="1" stop-color="#6c929b"/>
    </linearGradient>
    <!-- Erle: runde Krone, oft aus mehreren Stämmen -->
    <symbol id="erle" viewBox="0 0 24 36"><path d="M12 1c6 0 10 5 10 11 0 4-2 7-4 9 1 2 0 5-3 5-1 0-2-1-3-1s-2 1-3 1c-3 0-4-3-3-5-2-2-4-5-4-9C2 6 6 1 12 1z"/><path d="M10.4 25h1.4v11h-1.4zM13 24h1.4v12H13z"/></symbol>
    <!-- Erlenblatt: verkehrt eiförmig, an der Spitze eingekerbt -->
    <path id="leaf" d="M0 0C4-6 14-9 20-6c2 2 2 4 1 6 1 2 1 4-1 6C14 9 4 6 0 0z"/>
  </defs>
  <rect width="400" height="520" fill="url(#sky)"/>
  <circle cx="96" cy="178" r="46" fill="#f6ead2" opacity=".9"/>
  <g fill="#eef0e6" opacity=".7">
    <ellipse cx="148" cy="62" rx="64" ry="6"/>
    <ellipse cx="300" cy="158" rx="58" ry="5"/>
    <ellipse cx="58" cy="112" rx="40" ry="4"/>
  </g>
  <!-- Graureiher im Flug -->
  <g fill="#38464b">
    <path d="M196 113c-8-19-30-27-44-23 18 6 30 14 36 25z"/>
    <path d="M212 115c14-13 36-17 52-13-18 4-34 10-44 17z"/>
    <path d="M188 115c8-5 28-5 38 0-8 5-28 6-38 0z"/>
    <path d="M188 115c-5-3-10-3-12-1l-12 1 12 1c3 2 8 2 12 1z"/>
  </g>
  <path d="M226 115l22 2" stroke="#38464b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Ferne Höhen -->
  <path d="M0 262c34-10 70-16 106-10s64-14 102-10 72 14 112 6 54-6 80-2v80H0z" fill="#a9b6b1"/>
  <path d="M0 290c46-14 90-16 136-8s88-4 126 2 92-12 138-6v70H0z" fill="#8c9f93"/>
  <!-- Wiesenebene mit Heuwiesen und nassen Stellen -->
  <path d="M0 318c70-8 140-10 210-6s130 4 190 0v206H0z" fill="#adb07c"/>
  <g fill="#c2b985">
    <path d="M24 336l78-4 6 14-82 5z"/><path d="M276 330l70 1-2 14-70-1z"/><path d="M300 368l64 2-2 14-64-2z"/>
  </g>
  <g fill="#98a26d">
    <path d="M36 376c22-6 52-6 70 0-14 6-52 8-70 0z"/><path d="M240 404c18-5 44-5 60 0-14 6-44 6-60 0z"/>
  </g>
  <!-- See -->
  <path d="M120 334c34-10 92-10 124-2 16 5 10 15-8 18-34 6-92 6-118-2-14-4-12-11 2-14z" fill="url(#lake)"/>
  <g stroke="#e6eeea" stroke-width="2" stroke-linecap="round" opacity=".6">
    <path d="M150 338h40"/><path d="M176 345h46"/><path d="M140 351h24"/>
  </g>
  <!-- Fluss aus dem See -->
  <path d="M212 352c-6 22 22 32 14 52s-40 26-30 50 30 30 22 66" fill="none" stroke="#9cc0c4" stroke-width="9" stroke-linecap="round"/>
  <path d="M212 352c-6 22 22 32 14 52s-40 26-30 50 30 30 22 66" fill="none" stroke="#dce9e7" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- Steg -->
  <path d="M184 450h30" stroke="#6a5240" stroke-width="3.5"/>
  <path d="M187 450v7M196 450v7M205 450v7M212 450v7" stroke="#5a4535" stroke-width="1.6"/>
  <!-- Dorf -->
  <g>
    <rect x="286" y="352" width="15" height="10" fill="#efe2c5"/><path d="M284 353l9.5-7 9.5 7z" fill="#8f4c31"/>
    <rect x="305" y="355" width="13" height="9" fill="#e8d9b8"/><path d="M303 356l8.5-6 8.5 6z" fill="#7d4430"/>
    <rect x="322" y="342" width="8" height="22" fill="#e8d9b8"/><path d="M321 343l5-16 5 16z" fill="#4f3a2e"/>
    <rect x="330" y="352" width="18" height="12" fill="#efe2c5"/><path d="M328 353l11-6 11 6z" fill="#7d4430"/>
  </g>
  <!-- Erlen an See und Fluss: hinten heller, vorn dunkler -->
  <g fill="#4a6450">
    <use href="#erle" x="104" y="322" width="15" height="23"/>
    <use href="#erle" x="236" y="324" width="16" height="24"/>
    <use href="#erle" x="251" y="329" width="14" height="21"/>
    <use href="#erle" x="232" y="366" width="17" height="26"/>
    <use href="#erle" x="248" y="374" width="15" height="23"/>
  </g>
  <g fill="#34503c">
    <use href="#erle" x="186" y="382" width="18" height="27"/>
    <use href="#erle" x="170" y="392" width="16" height="24"/>
    <use href="#erle" x="214" y="418" width="20" height="30"/>
    <use href="#erle" x="158" y="438" width="20" height="30"/>
  </g>
  <!-- Vordergrund: Ufer mit Schilf und Rohrkolben -->
  <path d="M0 470c50-16 110-14 150 6s52 44 52 44H0z" fill="#5d6b45"/>
  <path d="M400 462c-46 4-80 24-92 58h92z" fill="#55653f"/>
  <g stroke="#7b7f4c" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M18 520c0-30 2-50 6-66"/><path d="M30 520c0-28-2-44-6-58"/><path d="M42 520c2-34 6-52 12-64"/>
    <path d="M56 520c0-24 0-38-2-50"/><path d="M70 520c2-30 4-46 10-58"/><path d="M84 520c0-20-2-32-6-44"/>
    <path d="M98 520c2-26 6-40 10-50"/><path d="M352 520c0-26 2-42 6-54"/><path d="M366 520c0-30-2-46-6-58"/>
    <path d="M380 520c2-28 4-44 10-56"/>
  </g>
  <g fill="#6a4a30">
    <rect x="22" y="457" width="4" height="13" rx="2"/><rect x="52" y="459" width="4" height="12" rx="2"/>
    <rect x="78" y="465" width="4" height="12" rx="2"/><rect x="356" y="469" width="4" height="12" rx="2"/>
  </g>
  <!-- Erlenzweig mit Blättern, Zapfen und Kätzchen -->
  <path d="M404-4c-22 18-42 34-66 46s-38 24-50 40" fill="none" stroke="#4a3a2c" stroke-width="3" stroke-linecap="round"/>
  <path d="M356 34c-4 10-4 20 0 30M330 52c2 10 0 18-4 26M372 22c6 8 14 12 24 14" fill="none" stroke="#4a3a2c" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="#3e5b42">
    <use href="#leaf" transform="translate(382 12) rotate(150) scale(1.2)"/>
    <use href="#leaf" transform="translate(360 30) rotate(70) scale(1.15)"/>
    <use href="#leaf" transform="translate(340 46) rotate(160) scale(1.25)"/>
    <use href="#leaf" transform="translate(316 62) rotate(110) scale(1.1)"/>
    <use href="#leaf" transform="translate(298 74) rotate(200)"/>
  </g>
  <g fill="#5a3b28">
    <ellipse cx="356" cy="68" rx="3.4" ry="5"/><ellipse cx="349" cy="66" rx="3" ry="4.4"/>
    <ellipse cx="326" cy="82" rx="3.2" ry="4.8"/><ellipse cx="397" cy="38" rx="3" ry="4.4"/>
  </g>
  <g stroke="#8b6b3a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M304 76c-1 10 0 20 3 28"/><path d="M292 84c-2 9-1 18 1 25"/>
  </g>
  <g stroke="#b08f55" stroke-width="1.4" stroke-dasharray="1.6 1.8" stroke-linecap="round" fill="none">
    <path d="M304 76c-1 10 0 20 3 28"/><path d="M292 84c-2 9-1 18 1 25"/>
  </g>
</svg>
