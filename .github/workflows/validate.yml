name: Datenqualität
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript prüfen
        run: |
          node --check assets/app.js
          node --check assets/monitor.js
          node --check assets/journal.js
          node --check assets/journal-karte.js
          node --check assets/journal-epochen.js
          node --check assets/report-1911.js
          node --check assets/report-1911-dec.js
          node --check assets/decade.js
          node --check scripts/build-decade.mjs
          node --check scripts/validate-data.mjs
          node --check scripts/validate-report-1911.mjs
          node --check scripts/validate-report-1911-dec.mjs
          node --check scripts/import-watcher.mjs
          python3 -m py_compile scripts/monitor_files.py scripts/monitor_build.py scripts/import-monitor.py scripts/publish-monitor.py scripts/build-journal.py scripts/journal_karte.py scripts/journal_epochen.py scripts/test-build-journal.py scripts/erlental-fakten.py scripts/test-erlental-fakten.py
      - name: Daten prüfen
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-monitor.mjs
          node scripts/validate-journal.mjs
          python3 scripts/test-build-journal.py
          python3 scripts/test-erlental-fakten.py
          node scripts/validate-report-1911.mjs
          node scripts/validate-report-1911-dec.mjs
          node scripts/build-decade.mjs --check
      - name: Neue Welt und Watcher-Import testen
        run: |
          node scripts/new-save.mjs --id ci-test-world --name "Test-Welt" --year 1900
          printf 'Linie\tHaltestellen\tFahrzeuge\tBelegt\tKapazität\tAuslastung\nBus Passagiere-Test-LO-1\t2\t1\t3\t6\t50%%\n' > /tmp/test-lines.tsv
          printf 'Industrie\tStufe\tProduktion\nTest Holzfällerlager\t3\taktiv\n' > /tmp/test-industry.tsv
          node scripts/import-watcher.mjs --save ci-test-world --kind lines --date 1900-04-01 --input /tmp/test-lines.tsv
          node scripts/import-watcher.mjs --save ci-test-world --kind industries --date 1900-04-01 --input /tmp/test-industry.tsv
          node scripts/validate-data.mjs
